name: VQCC invsqrt experiment

on:
  push:
    branches: ["experiment/vqcc-invsqrt"]
    paths:
      - "experiments/vqcc/**"
      - ".github/workflows/vqcc-invsqrt.yml"
  pull_request:
    paths:
      - "experiments/vqcc/**"
      - ".github/workflows/vqcc-invsqrt.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: vqcc-invsqrt-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 65
    env:
      OMP_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
      NPY_NUM_BUILD_JOBS: "2"
      VQCC_OUTPUT: vqcc-results
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pinned build dependencies
        run: python -m pip install numpy==2.2.6 pybind11==2.13.6 setuptools==75.8.0 wheel==0.45.1
      - name: Obtain pinned native Google kickmix source
        run: |
          git clone --filter=blob:none --no-checkout https://github.com/quantumlib/Qualtran.git /tmp/vqcc-qualtran
          git -C /tmp/vqcc-qualtran sparse-checkout set kickmix
          git -C /tmp/vqcc-qualtran checkout f559b12af459e7e97e6c6c382434431c03b903c9
      - name: Build native kickmix
        run: python -m pip install --no-build-isolation /tmp/vqcc-qualtran/kickmix
      - name: Compile candidates and verify complete domain
        run: python -u experiments/vqcc/run.py
      - name: Preserve results and circuit files
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vqcc-invsqrt-${{ github.run_id }}
          path: vqcc-results/
          if-no-files-found: warn
          retention-days: 30
