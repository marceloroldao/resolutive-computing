name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Environment
        run: |
          python --version
          python -m pip --version
      - name: Upgrade packaging tools
        run: python -m pip install --upgrade pip setuptools wheel
      - name: Install project
        run: python -m pip install -e ".[test,bench]"
      - name: Test
        run: python -m pytest -q
      - name: Classical benchmark smoke
        if: matrix.python-version == '3.12'
        run: python benchmarks/run_classical.py --dimension 4 --budget 600 --seeds 2 --output /tmp/classical.csv
      - name: Scaling benchmark smoke
        if: matrix.python-version == '3.12'
        run: python benchmarks/run_scaling.py --dimensions 4 6 --budget-per-dimension 250 --seeds 1 --output /tmp/scaling.csv
      - name: Ablation benchmark smoke
        if: matrix.python-version == '3.12'
        run: python benchmarks/run_ablation.py --dimension 4 --budget 600 --seeds 1 --output /tmp/ablation.csv
      - name: Generalization benchmark smoke
        if: matrix.python-version == '3.12'
        run: python benchmarks/run_generalization.py --dimension 4 --budget 1000 --seeds 1 --output /tmp/generalization.csv
      - name: PID control application smoke
        if: matrix.python-version == '3.12'
        run: python benchmarks/run_pid_control.py --budget 300 --seeds 1 --output /tmp/pid_control.csv
      - name: MPPT application smoke
        if: matrix.python-version == '3.12'
        run: python benchmarks/run_mppt.py --budget 120 --seeds 1 --output /tmp/mppt.csv
      - name: Versioned reference experiment smoke
        if: matrix.python-version == '3.12'
        run: python experiments/run_reference.py --config experiments/reference_v0.1.json --output-dir /tmp/reference-v0.1 --smoke
      - name: Incremental Multires comparison
        if: matrix.python-version == '3.12'
        run: |
          python benchmarks/run_multires_session_compare.py --dimension 10 --budget 3000 --seeds 3 --output /tmp/multires_session_compare.csv
          echo '=== MONOLITHIC VS ASK-TELL MULTIRES ==='
          cat /tmp/multires_session_compare.csv
      - name: Controlled 10D comparison campaign
        if: matrix.python-version == '3.12'
        run: |
          python benchmarks/run_classical.py --dimension 10 --budget 3000 --seeds 8 --output /tmp/reference_campaign_10d.csv
          echo '=== REFERENCE CAMPAIGN 10D ==='
          cat /tmp/reference_campaign_10d.csv
      - name: Strong external baselines 10D
        if: matrix.python-version == '3.12'
        run: |
          python benchmarks/run_strong_baselines.py --dimension 10 --budget 3000 --seeds 8 --output /tmp/strong_baselines_10d.csv
          echo '=== STRONG BASELINES 10D ==='
          cat /tmp/strong_baselines_10d.csv
      - name: Dimensional scaling campaign
        if: matrix.python-version == '3.12'
        run: |
          python benchmarks/run_scaling.py --dimensions 10 20 30 50 --budget-per-dimension 600 --seeds 8 --output /tmp/scaling_10_50d.csv
          echo '=== SCALING 10D-50D ==='
          cat /tmp/scaling_10_50d.csv
      - name: Rotated/noisy diagnostic campaign
        if: matrix.python-version == '3.12'
        run: |
          python benchmarks/run_generalization.py --dimension 10 --budget 3000 --seeds 8 --instance-seed 2026 --noise-fraction 0.01 --output /tmp/generalization_10d.csv
          echo '=== GENERALIZATION 10D ==='
          cat /tmp/generalization_10d.csv
      - name: Multi-instance geometry campaign
        if: matrix.python-version == '3.12'
        run: |
          python benchmarks/run_multi_instance_geometry.py --dimension 10 --budget 3000 --seeds 4 --instance-seeds 2026 2027 2028 2029 --noise-fraction 0.01 --output /tmp/multi_instance_geometry.csv
          echo '=== MULTI-INSTANCE GEOMETRY ==='
          cat /tmp/multi_instance_geometry.csv
