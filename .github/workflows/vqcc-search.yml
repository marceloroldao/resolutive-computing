name: VQCC equal-budget search

on:
  push:
    branches: ["experiment/vqcc-invsqrt"]
    paths:
      - "experiments/vqcc_search/**"
      - ".github/workflows/vqcc-search.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: vqcc-search-${{ github.ref }}
  cancel-in-progress: true

jobs:
  compare:
    runs-on: ubuntu-24.04
    timeout-minutes: 65
    env:
      OMP_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
      NPY_NUM_BUILD_JOBS: "2"
      VQCC_OUTPUT: vqcc-search-results
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - name: Install pinned dependencies
        run: python -m pip install numpy==2.2.6 scipy==1.15.3 pybind11==2.13.6 setuptools==75.8.0 wheel==0.45.1
      - name: Check equal-budget accounting
        run: python -m unittest discover -s experiments/vqcc_search -p test_protocol.py -v
      - name: Restore pinned native wheel
        id: wheel
        uses: actions/cache@v4
        with:
          path: .cache/vqcc-wheels
          key: vqcc-ubuntu24-py312-f559b12-pybind2136-numpy226
      - name: Build native Google kickmix wheel
        if: steps.wheel.outputs.cache-hit != 'true'
        run: |
          git clone --filter=blob:none --no-checkout https://github.com/quantumlib/Qualtran.git /tmp/vqcc-qualtran
          git -C /tmp/vqcc-qualtran sparse-checkout set kickmix
          git -C /tmp/vqcc-qualtran checkout f559b12af459e7e97e6c6c382434431c03b903c9
          python -m pip wheel --no-deps --no-build-isolation /tmp/vqcc-qualtran/kickmix -w .cache/vqcc-wheels
      - name: Install native wheel
        run: python -m pip install --no-deps .cache/vqcc-wheels/kickmix-*.whl
      - name: Compare four methods and validate winner
        run: python -u experiments/vqcc_search/search.py
      - name: Preserve per-seed results and circuit
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: vqcc-search-${{ github.run_id }}
          path: vqcc-search-results/
          if-no-files-found: warn
          retention-days: 30
