name: Package Validation

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "pyproject.toml"
      - "src/**"
      - "README.md"
      - "LICENSE"
      - "CITATION.cff"
      - "CHANGELOG.md"
      - ".github/workflows/package-validation.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build artifacts
        run: |
          python -m pip install --upgrade pip build twine
          python -m build
          python -m twine check dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: python-dist
          path: dist/
          if-no-files-found: error

  clean-install:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Build wheel
        run: |
          python -m pip install --upgrade pip build
          python -m build --wheel
      - name: Install wheel only
        run: |
          python -m pip install dist/*.whl
      - name: Import public API
        run: |
          python - <<'PY'
          import resolutive
          required = {
              "optimize",
              "create_session",
              "checkpoint_session",
              "restore_session",
              "checkpoint_json",
              "restore_json",
              "SessionRegistry",
              "PersistentSessionRegistry",
              "OptimizationResult",
              "OptimizationSession",
              "AskBatch",
          }
          missing = sorted(name for name in required if not hasattr(resolutive, name))
          if missing:
              raise SystemExit(f"missing public API symbols: {missing}")
          print("public API import OK")
          PY
