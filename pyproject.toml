[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "resolutive-computing"
version = "0.1.0.dev0"
description = "Modular framework for resolutive computation and black-box optimization research."
readme = "README.md"
requires-python = ">=3.10"
authors = [{name = "Marcelo Roldão Matos"}]
dependencies = ["numpy>=1.26"]

[project.optional-dependencies]
bench = ["scipy>=1.12", "pandas>=2.2"]
test = ["pytest>=8.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
